[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reelscribe"
version = "0.1.0"
description = "Turn social-media video URLs (Facebook, YouTube, Instagram, TikTok, ...) into a searchable offline library: video + audio + transcript + thumbnail + draft markdown doc."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "javz3" }]
requires-python = ">=3.9"
keywords = ["yt-dlp", "whisper", "transcription", "knowledge-base", "reels", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.4.9",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.90"]
dev = ["pytest>=7"]

[project.scripts]
reelscribe = "reelscribe.cli:main"

[project.urls]
Homepage = "https://github.com/javz3/reelscribe"

[tool.setuptools.packages.find]
include = ["reelscribe*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E731"]  # lambda-as-def used deliberately in library.stats

[tool.ruff.lint.per-file-ignores]
"reelscribe/webapp.py" = ["E501"]  # embedded single-page HTML/JS template

[tool.pytest.ini_options]
testpaths = ["tests"]
