name: CI

on:
  push:
    branches: [main, "v2*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check . || true  # formatting advisory until v2 lands

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # setup-uv with python-version already provisions and activates a venv
      - run: uv pip install -e '.[web,dev]'
      # --no-project: test the env we just installed, don't re-resolve deps
      - run: uv run --no-project python -m pytest tests/ -q
